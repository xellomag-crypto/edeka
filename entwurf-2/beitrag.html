<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Aktuelles | EDEKA Meyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16283A;--blue:#2D5B86;--bg:#F3F6F9;--line:#DAE2EA;--grey:#4A5B6B;--sun:#F3D35B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
.top{padding:20px 0}
.top a{font:700 15px 'DM Sans',sans-serif;color:var(--ink);text-decoration:none}
.hero{aspect-ratio:16/10;border-radius:22px;overflow:hidden;background:#DCE6EF}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.eyebrow{font:700 13px 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:28px 0 8px}
h1{font:800 clamp(34px,6vw,52px)/1.04 'Bricolage Grotesque',sans-serif;margin:0}
.kurz{font-size:20px;color:var(--grey);margin:14px 0 0}
.datum{font:700 14px 'DM Sans',sans-serif;color:var(--blue);margin:18px 0 0}
.body p{font-size:18px;line-height:1.7;color:#243645;margin:18px 0 0}
.back{display:inline-block;margin:40px 0 60px;padding:14px 22px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700}
.leer{padding:80px 0;text-align:center;color:var(--grey)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html#aktuelles">← Zurück zur Startseite</a></div>
  <article id="art"></article>
  <a class="back" href="index.html#aktuelles">Alle Neuigkeiten</a>
</div>
<script src="cms.js"></script>
<script>
(function(){
  var id=new URLSearchParams(location.search).get('id'),d={};
  try{d=JSON.parse(localStorage.getItem('meyer-cms-v1'))||{}}catch(e){}
  var p=(d.posts||[]).filter(function(x){return x.id===id})[0],art=document.getElementById('art');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  if(!p){art.appendChild(el('p','leer','Diesen Beitrag gibt es nicht mehr.'));return}
  document.title=p.titel+' | EDEKA Meyer';
  if(p.bild){var h=el('div','hero'),i=el('img');i.src=p.bild;i.alt=p.titel;h.appendChild(i);art.appendChild(h)}
  art.appendChild(el('p','eyebrow',p.rubrik||'Aktuelles'));
  art.appendChild(el('h1','',p.titel));
  if(p.kurz)art.appendChild(el('p','kurz',p.kurz));
  var dt=p.datum.split('-');art.appendChild(el('p','datum',parseInt(dt[2],10)+'.'+parseInt(dt[1],10)+'.'+dt[0]));
  var b=el('div','body');(p.text||'').split(/\n\s*\n/).forEach(function(t){if(t.trim())b.appendChild(el('p','',t.trim()))});
  art.appendChild(b);
})();
</script>
</body>
</html>
